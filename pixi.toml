[workspace]
name = "gam-workshop-dortmund-25"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
# Python side
python = ">=3.11,<3.14"
numpy = ">=2.2.5"
pandas = ">=2.2.3"
scipy = ">=1.12"
matplotlib = ">=3.10"
rpy2 = ">=3.6.2"
ipykernel = "*"
jupyterlab = "*"
nbconvert = "*"

# R side (used by R_demos and, through rpy2, by pymgcv)
r-base = ">=4.3"
r-mgcv = "*"
r-mgcviz = "*"
r-qgam = "*"
r-mass = "*"
r-dplyr = "*"
r-magrittr = "*"
r-mvnfast = "*"
r-remotes = "*"
r-rcpp = "*"
r-rcpparmadillo = "*"

# Compilers, needed to build the GitHub-only R packages from source
c-compiler = "*"
cxx-compiler = "*"
fortran-compiler = "*"
make = "*"

[pypi-dependencies]
pymgcv = ">=0.0.10"

[tasks]
# R packages that are only available on GitHub (testGam, gamFactory, SCM)
install-r-github = { cmd = "Rscript -e \"remotes::install_github(c('mfasiolo/testGam', 'mfasiolo/gamFactory', 'VinGioia90/SCM'), upgrade = 'never', dependencies = TRUE)\"" }
check-r = { cmd = "Rscript -e \"for (p in c('mgcv','mgcViz','qgam','testGam','gamFactory','SCM')) { suppressPackageStartupMessages(library(p, character.only = TRUE)); cat(p, as.character(packageVersion(p)), '\\n') }\"" }
check-py = { cmd = "python -c \"import pymgcv; import rpy2.robjects as ro; print('pymgcv OK, R mgcv', ro.r('as.character')(ro.r('packageVersion')('mgcv'))[0])\"" }
check = { depends-on = ["check-r", "check-py"] }
r-demo = { cmd = "Rscript {{ script }}", cwd = "R_demos", args = ["script"] }
lab = { cmd = "jupyter lab --notebook-dir=Py_demos" }
run-notebooks = { cmd = "jupyter nbconvert --to notebook --execute --inplace Py_demos/*.ipynb" }
